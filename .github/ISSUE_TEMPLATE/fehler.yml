name: Fehler / Bug
description: Etwas funktioniert nicht wie in Anleitung oder Testleitfaden beschrieben (something does not work)
title: "[Fehler] "
labels: ["fehler"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für die Meldung! Bitte keine Modelldateien und keine persönlichen Daten anhängen.
        Thanks for reporting! English is fine too.
  - type: input
    id: sender
    attributes:
      label: Sender / Radio
      description: z. B. X18RS, X20S, X14, Twin X Lite
    validations:
      required: true
  - type: input
    id: ethos
    attributes:
      label: Ethos-Version
      description: System › Info, z. B. 26.2.0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Jet-Version
      description: Steht im Widget-Menü oben («Version …»), z. B. 0.1.2
    validations:
      required: true
  - type: input
    id: testfall
    attributes:
      label: Testfall (Nummer aus TESTLEITFADEN.md)
      description: falls zutreffend, z. B. 7
  - type: textarea
    id: sensoren
    attributes:
      label: Empfänger und Sensoren
      description: z. B. Archer Plus SR10+, Turbine und ECU (Hersteller, Modell, Firmware), Telemetrieadapter oder VSpeak-Converter (welcher), Vario …
  - type: textarea
    id: schritte
    attributes:
      label: Schritte / Steps
      description: Was hast du nacheinander gemacht?
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Erwartet und tatsächlich / Expected and actual
      description: Was hast du erwartet, was ist passiert?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Zeilen mit «Jet» aus dem Debug-Log der FrSky Suite, oder roter Text unten links im Widget
      render: text
  - type: textarea
    id: bild
    attributes:
      label: Bildschirmfoto / Screenshot
      description: Bild hier hineinziehen (Handyfoto genügt)
